<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Sensi · Free Fire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f1ec;--surface:#ffffff;--line:#d9d5cb;--text:#1b1a17;--muted:#6b675d;
  --accent:#e8590c;--accent-ink:#ffffff;--track:#e4e0d6;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a;--surface:#1d2026;--line:#2e323a;--text:#eceae4;--muted:#9a9a94;
  --accent:#ff7a2f;--accent-ink:#1a0e05;--track:#2e323a;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#14161a;--surface:#1d2026;--line:#2e323a;--text:#eceae4;--muted:#9a9a94;
  --accent:#ff7a2f;--accent-ink:#1a0e05;--track:#2e323a;color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 28px/1.1 "Chakra Petch",Impact,sans-serif;margin:8px 0 4px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 20px}
h2{font:700 15px/1.2 "Chakra Petch",sans-serif;margin:0 0 10px}
.group{margin-bottom:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 15px;font:600 14px Inter,sans-serif;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.top label{font-weight:600}
.val{font:700 26px/1 "Chakra Petch",sans-serif;color:var(--accent);min-width:3ch;text-align:right}
input[type=range]{width:100%;height:32px;background:transparent;-webkit-appearance:none;appearance:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--track) var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--track)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:4px solid var(--accent);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--accent)}
.meter{margin:16px 0 20px}
.bar{height:10px;border-radius:10px;background:var(--track);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:10px;transition:width .2s}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;min-height:48px;border-radius:12px;font:700 15px "Chakra Petch",sans-serif;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--text)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{color:var(--muted);font-size:13px;margin-top:16px}
.pol{width:130px;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:0 14px;font:700 20px "Chakra Petch",sans-serif}
#toast{min-height:20px;margin-top:10px;font-weight:600;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Painel de Sensi</h1>
  <p class="sub">Ajuste a sensibilidade do Free Fire (0 a 200) e copie os valores para o jogo.</p>

  <div class="group">
    <h2>Estilo de jogo</h2>
    <div class="chips" id="estilos" role="group" aria-label="Estilo de jogo"></div>
  </div>
  <div class="group">
    <h2><label for="pol">Tela do celular (polegadas)</label></h2>
    <input class="pol" id="pol" type="text" inputmode="decimal" value="6.79" autocomplete="off">
  </div>

  <div class="panel" id="sliders"></div>

  <div class="meter">
    <div class="top"><h2 style="margin:0">Perfil da sensi</h2><span id="perfil" style="font-weight:600"></span></div>
    <div class="bar"><i id="barra"></i></div>
    <div class="legend"><span>Precisão</span><span>Velocidade</span></div>
  </div>

  <div class="actions">
    <button class="btn" id="reset">Voltar ao preset</button>
    <button class="btn main" id="copiar">Copiar valores</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <p class="note">Os presets são pontos de partida. Teste no treino por alguns minutos e mexa de 3 em 3 pontos até a mira ficar confortável para você.</p>
</main>

<script>
const CAMPOS=[
  ["geral","Geral",200],["vermelho","Ponto vermelho",200],["x2","Mira 2x",200],
  ["x4","Mira 4x",200],["awm","Mira AWM",200],["livre","Olhadinha",200],
  ["botao","Tamanho do botão de tiro",100,"%"]
];
const ESTILOS={
  "Suave":{geral:185,vermelho:180,x2:175,x4:165,awm:90,livre:150,botao:48},
  "Capa":{geral:190,vermelho:180,x2:176,x4:164,awm:140,livre:120,botao:48},
  "Rush":{geral:200,vermelho:200,x2:190,x4:180,awm:160,livre:140,botao:48},
  "Equilibrado":{geral:170,vermelho:160,x2:150,x4:140,awm:110,livre:100,botao:48},
  "Precisão":{geral:150,vermelho:140,x2:140,x4:130,awm:90,livre:90,botao:48}
};
const REF=6.79,K=8;
const MAX=200;
let estilo="Suave",pol=6.79,v={};
const clamp=n=>Math.max(0,Math.min(MAX,n));

function chips(id,obj,get,set){
  const el=document.getElementById(id);
  Object.keys(obj).forEach(k=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=k;b.type="button";
    b.onclick=()=>{set(k);render()};
    el.appendChild(b);
  });
  return ()=>[...el.children].forEach(b=>b.setAttribute("aria-pressed",b.textContent===get()));
}
const upE=chips("estilos",ESTILOS,()=>estilo,k=>{estilo=k;aplicar()});
document.getElementById("pol").addEventListener("input",e=>{
  const n=parseFloat(String(e.target.value).replace(",","."));
  if(n>=4&&n<=13){pol=n;aplicar();paint()}
});

function aplicar(){
  const base=ESTILOS[estilo],mod=Math.round((REF-pol)*K);
  CAMPOS.forEach(([k,,m])=>v[k]=k==="botao"?base[k]:Math.max(0,Math.min(m,base[k]+mod)));
}
const box=document.getElementById("sliders");
CAMPOS.forEach(([k,nome,m])=>{
  const r=document.createElement("div");r.className="row";
  r.innerHTML=`<div class="top"><label for="s-${k}">${nome}</label><span class="val" id="v-${k}"></span></div>
  <input type="range" id="s-${k}" min="0" max="${m}" step="1">`;
  box.appendChild(r);
  r.querySelector("input").addEventListener("input",e=>{v[k]=+e.target.value;paint()});
});

function paint(){
  CAMPOS.forEach(([k,,m,u])=>{
    const s=document.getElementById("s-"+k);
    s.value=v[k];s.style.setProperty("--p",(v[k]/m*100)+"%");
    document.getElementById("v-"+k).textContent=v[k]+(u||"");
  });
  const SENS=CAMPOS.filter(c=>c[0]!=="botao");
  const media=SENS.reduce((a,[k])=>a+v[k],0)/SENS.length/MAX*100;
  document.getElementById("barra").style.width=media+"%";
  document.getElementById("perfil").textContent=
    media>=85?"Muito rápida":media>=72?"Rápida":media>=58?"Equilibrada":"Controlada";
}
function render(){upE();paint()}
aplicar();render();

const toast=document.getElementById("toast");
function aviso(t){toast.textContent=t;setTimeout(()=>toast.textContent="",2500)}
document.getElementById("reset").onclick=()=>{aplicar();paint();aviso("Valores do preset restaurados")};
document.getElementById("copiar").onclick=async()=>{
  const txt=CAMPOS.map(([k,n,m,u])=>n+": "+v[k]+(u||"")).join("\n");
  try{await navigator.clipboard.writeText(txt);aviso("Valores copiados")}
  catch(e){aviso("Não foi possível copiar. Anote os valores da tela.")}
};
</script>
</body>
</html>
